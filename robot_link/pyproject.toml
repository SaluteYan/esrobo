[project]
name = "esrobo-robot-link"
version = "0.1.0"
description = "Laptop joint targets and robot-side feedback/watchdog transport"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["esrobo_link*"]
