[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esrobo-teleoperation"
version = "0.2.0"
description = "Distributed ESROBO teleoperation: computer-side acquisition and IK, shared robot execution components"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.14,<2", "PyYAML>=6", "pin>=3,<5", "paramiko>=3.5,<5"]

[project.optional-dependencies]
test = ["pytest>=7", "pybind11>=2.11,<4"]
build = ["pybind11>=2.11,<4"]
robot = ["python-can>=3.3.4"]

[project.scripts]
esrobo-laptop = "esrobo_laptop.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["esrobo_laptop*", "esrobo_teleop*"]

[tool.setuptools.package-data]
esrobo_laptop = ["_hand_native.cpp"]
