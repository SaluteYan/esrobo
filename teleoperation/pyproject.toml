[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "esrobo-teleop-real"
version = "0.1.0"
description = "Real-machine dual-arm + LinkerHand teleoperation for the ESROBO robot (PICO full-body + SenseGlove Nova 2)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pyyaml>=6.0",
    "python-can>=3.3.4",
    "pinocchio>=3.0.0",
    "pink>=0.8.0",
    "qpsolvers>=4.0.0",
    "proxsuite>=0.6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.json"]
